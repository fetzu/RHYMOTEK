# Dependabot *security updates* are disabled for this repo (via the
# automated-security-fixes API). Dependabot *alerts* remain enabled, so
# vulnerabilities are still reported in the Security tab -- only the automated
# fix PRs are off.
#
# Why: security-update jobs failed with `security_update_not_possible` on
# every push, because the whole advisory set was transitive under TinaCMS.
# That set has since shrunk a lot -- see below -- but the two that remain
# still cannot be auto-fixed, so the jobs would still fail.
#
# Still stuck:
#   react-router / react-router-dom
#                   Two advisories whose only fix is v7. tinacms requires
#                   ^6.30.3, and v7 makes the admin router match no routes,
#                   so /admin renders blank. Listed under `ignore` below.
#
# Cleared since this note was first written, and worth remembering as a
# lesson -- do NOT assume an advisory is permanently stuck:
#   vite 4, esbuild 0.24
#                   @tinacms/cli 2.6 moved to Vite 6. Whole cluster gone.
#   markdown-it 12, linkify-it 3
#                   @tinacms/app 2.5.12 moved graphiql off the
#                   3.0.0-alpha.1 pre-release to ^4.1.2.
#   js-yaml 3.x, react-router-dom 6.30.x
#                   Both were recorded here as advisories whose named fix
#                   version "was never published". Both were later
#                   backported: 3.15.1 and 6.30.6 exist and resolve today.
#                   An old release line can still get a security backport.
#   mermaid, dompurify, nanoid, js-cookie
#                   Resolved by scoped overrides in pnpm-workspace.yaml.
#
# TinaCMS itself is kept at its newest published version. Note that its
# manifests on GitHub show no version numbers -- the monorepo uses pnpm's
# catalog protocol ("graphiql": "catalog:"), with the real pin in the catalog
# block of its root pnpm-workspace.yaml. Read that, or
# `npm view @tinacms/app@latest dependencies --json`, not the manifest.
#
# Nothing here reaches the public site -- src/ never imports tinacms, and
# none of it appears in the built client bundle. tinacms and @tinacms/cli are
# in devDependencies so Dependabot reports the set as development scope.
# Re-enable security updates once react-router is unblocked:
#   gh api -X PUT repos/fetzu/RHYMOTEK/automated-security-fixes
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "01:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dependabot"
    reviewers:
      - "fetzu"
    commit-message:
      prefix: "chore"
    # Majors that TinaCMS's own pins make unsafe. Both break only at runtime
    # in /admin -- `tinacms build` and `astro check` still pass -- so CI does
    # NOT catch either one. Do not merge a PR that reintroduces them.
    #
    #   react-router / react-router-dom >=7
    #     tinacms requires react-router-dom ^6.30.3. Newer majors make the
    #     admin router match no routes, so /admin renders a blank page.
    #
    #   react-final-form >=7
    #     v7 needs peer final-form ^5, but tinacms pins final-form to exactly
    #     4.20.10 and react-final-form ^6.5.9. Installing v7 therefore yields
    #     two coexisting copies (6.5.9+final-form@4 for TinaCMS, 7.x+
    #     final-form@5 for us). tina/fields/AnnotationEditor.tsx calls
    #     useFormState(), which is context-based, so the editor would resolve
    #     a different module instance than TinaCMS's form provider and stop
    #     seeing the form. Revisit once TinaCMS moves to final-form 5.
    #
    # Note: `ignore` does NOT keep security-update jobs green -- it only turns
    # `security_update_not_possible` into `all_versions_ignored`, which still
    # fails. Dependabot *security updates* are therefore disabled at the repo
    # level instead (automated-security-fixes API); alerts stay visible.
    # See the note above about the advisories that cannot be resolved.
    ignore:
      - dependency-name: "react-router"
        versions: [">=7.0.0"]
      - dependency-name: "react-router-dom"
        versions: [">=7.0.0"]
      - dependency-name: "react-final-form"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "01:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dependabot"
    reviewers:
      - "fetzu"
    commit-message:
      prefix: "ci"
