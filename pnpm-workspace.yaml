allowBuilds:
  better-sqlite3: true
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  workerd: true

# pnpm 11 gates freshly-published versions behind a minimum release age.
# These entries were added automatically when the TinaCMS releases carrying
# the graphiql fix were only hours old, and they are load-bearing for CI:
# without them `pnpm install --frozen-lockfile` refuses the pinned versions.
# Safe to prune once these versions age past the threshold.
minimumReleaseAgeExclude:
  - '@tinacms/app@2.5.12'
  - '@tinacms/cli@2.6.1'
  - '@tinacms/graphql@2.4.10'
  - '@tinacms/mdx@2.2.1'
  - '@tinacms/metrics@2.1.2'
  - '@tinacms/search@1.2.24'
  - tinacms@3.12.1

# Security pins for transitive dependencies (advisory remediation).
# pnpm reads overrides from this file, NOT from package.json.
# Scoped keys (`pkg@major`) pin one release line only, so older consumers
# that legitimately need an earlier major are left alone.
overrides:
  # existing pins, raised to the currently-patched floor
  undici: ^7.29.0
  dompurify: ^3.4.13
  mermaid: ^11.16.1
  lodash: ^4.17.24
  # NOTE: react-router / react-router-dom are deliberately NOT pinned.
  # TinaCMS's admin requires react-router-dom ^6.30.3; forcing v7 (or the v8
  # the advisory asks for) makes the admin router match no routes and render a
  # blank page. This pin was previously inert because pnpm ignored the npm-style
  # `overrides` in package.json. The advisory is accepted for now: it affects
  # the TinaCMS admin bundle only, not the public site. Revisit when TinaCMS
  # ships support for a newer react-router.
  picomatch: ^2.3.2
  fast-xml-parser: ^5.7.1
  path-to-regexp: ^0.1.13
  yaml: ^2.8.3
  h3: ^1.15.9
  brace-expansion: ^2.1.4
  smol-toml: ^1.6.1
  # NOTE: esbuild is deliberately NOT pinned -- do not re-add an override.
  # There used to be an `"esbuild@>=0.25": ^0.28.1` pin here, written when
  # @tinacms/cli bundled with Vite 4. As of @tinacms/cli 2.6 it bundles with
  # Vite 6, which asks for `esbuild: ^0.25.0` and resolves 0.25.x by itself --
  # already above the >=0.24.3 advisory floor, so the pin bought nothing. What
  # it *did* do was force Vite 6 onto the 0.28 line, and esbuild 0.27.7+ knows
  # Safari 14.0 has a destructuring bug. Vite 6's default build.target
  # ('modules') includes safari14, so esbuild tried to lower every
  # `const [a, b] = ...` in the admin bundle, could not, and failed the build
  # with thousands of errors. Astro's Vite gets 0.28.x on its own; leave both
  # to resolve naturally.

  # additional advisory remediation
  postcss: ^8.5.23
  svgo: ^4.0.2
  immutable: ^5.1.8
  qs: ^6.15.2
  sharp: ^0.35.2
  "fast-uri@3": ^3.1.5
  "protobufjs@7": ^7.6.5
  "body-parser@1": ^1.20.6
  "js-yaml@4": ^4.3.0
  "markdown-it@14": ^14.1.2
  "linkify-it@5": ^5.0.2
  "vite@7": ^7.3.5
  "@babel/core": ^7.29.1
  "@opentelemetry/core": ^2.8.0
  # Two copies coexist and each line has its own fix release, so both are
  # scoped rather than pinned globally: 3.x comes in via postcss (and so
  # reaches the public site's build), 5.x via @udecode/plate-core.
  "nanoid@3": ^3.3.18
  "nanoid@5": ^5.1.16
